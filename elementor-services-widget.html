<!--
  ווידג'ט שירות בודד (קוביית שירות)
  שימוש: באלמנטור גוררים ווידג'ט "HTML" לעמודה ומדביקים את כל תוכן הקובץ.
  לכל שירות – ווידג'ט נפרד; משנים בו את התמונה, הכותרת, התיאור והקישור.
-->
<style>
  .sc-service-card {
    --sc-card-bg: #f0f3f2;
    --sc-card-bg-hover: #fbf3eb;
    --sc-card-radius: 8px;
    --sc-title-color: #3b2b3d;
    --sc-text-color: #5a5a5a;
    --sc-image-size: 292px;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    min-height: 592px;
    padding: 80px 24px 48px;
    box-sizing: border-box;
    direction: rtl;
    background: var(--sc-card-bg);
    border-radius: var(--sc-card-radius);
    text-align: center;
    text-decoration: none;
    color: inherit;
    font-family: "Heebo", "Assistant", Arial, sans-serif;
    transition: background-color 0.3s ease;
  }

  .sc-service-card:hover,
  .sc-service-card:focus-visible {
    background: var(--sc-card-bg-hover);
    text-decoration: none;
    color: inherit;
  }

  .sc-service-card *,
  .sc-service-card *::before,
  .sc-service-card *::after {
    box-sizing: border-box;
  }

  .sc-service-card .sc-service-card__image {
    width: var(--sc-image-size);
    max-width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
  }

  .sc-service-card .sc-service-card__image img {
    display: block;
    width: 100%;
    height: 100%;
    max-width: none;
    margin: 0;
    border: 0;
    border-radius: 0;
    box-shadow: none;
    object-fit: cover;
  }

  .sc-service-card .sc-service-card__title {
    margin: 40px 0 6px;
    padding: 0;
    text-align: center;
    font-family: inherit;
    font-size: 28px;
    font-weight: 400;
    font-style: italic;
    line-height: 1.35;
    color: var(--sc-title-color);
  }

  .sc-service-card .sc-service-card__text {
    margin: 0;
    padding: 0;
    text-align: center;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.5;
    color: var(--sc-text-color);
  }

  /* ----- טאבלט ----- */
  @media (max-width: 1024px) {
    .sc-service-card {
      --sc-image-size: 220px;
      min-height: 480px;
      padding-top: 56px;
    }

    .sc-service-card .sc-service-card__title { font-size: 24px; }
  }

  /* ----- מובייל ----- */
  @media (max-width: 767px) {
    .sc-service-card {
      min-height: 0;
      padding: 40px 20px 36px;
    }

    .sc-service-card .sc-service-card__title {
      margin-top: 28px;
      font-size: 24px;
    }
  }
</style>

<a class="sc-service-card" href="#">
  <div class="sc-service-card__image">
    <img src="https://www.service-and-care.co.il/wp-content/uploads/REPLACE-post-surgery-care.jpg" alt="אחות מטפלת במטופלת בביתה" loading="lazy">
  </div>
  <h2 class="sc-service-card__title">השגחה וטיפול אחרי<br>ניתוח בבית או בביה"ח</h2>
  <p class="sc-service-card__text">מתן טיפול תומך ע"י אחות מוסמכת</p>
</a>
